# fly.io — `fly launch --copy-config --yes` then `fly secrets set ACCESS_KEY=yourkey`
app = "kyiv-air-watch-gb"
primary_region = "ams"
[build]
[env]
  PORT = "8080"
  DB_PATH = "/data/alerts.sqlite"
[mounts]
  source = "data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
# 1.41.1: one dedicated CPU. A shared CPU is throttled to 6.25 % once its burst is spent (attack nights) and the
# pages time out. `fly deploy` sets the machine to this size: a `fly scale vm` alone is undone by the next deploy.
[[vm]]
  size = "performance-1x"
  memory = "2gb"
