<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Що робити — пам'ятка про загрози · Heimdall</title>
<link rel="icon" href="/static/heimdall-64.png">
<style>
/* 1.40: the pages fade into each other instead of reloading on a blank screen */
@view-transition{navigation:auto}
::view-transition-old(root){animation:vt-out .16s ease-in both}
::view-transition-new(root){animation:vt-in .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes vt-out{to{opacity:0}}@keyframes vt-in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

/* Heimdall — what to do, weapon by weapon (1.35).
   One page, three languages, nothing fetched but the map's own silhouettes (static/glyphs.js): it has to open in a
   corridor on 2G, and — kept by the service worker (static/sw.js) — with no network at all. Every rule on it comes
   from the official guidance listed at the bottom (ДСНС, police, Ministry of Health, an oblast administration);
   docs/SAFETY.md says why nothing else goes on it. The content is the JSON block below, the same shape in each
   language (tests/test_guide.py checks it). */
:root{--bg:#0b0d11;--panel:#12151b;--panel2:#181c24;--line:#242830;--ink:#e8e6df;--ink2:#a9a79f;--ink3:#77766f;
  --red:#e0342c;--ora:#ff8a3d;--amb:#ffb15c;--msl:#ff5b52;--vio:#b07cff;--blu:#5b9cff;--grn:#2fbf71;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:12px}
html,body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--sans)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
a{color:#8fb4ff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:12px 0 6px}
header img{width:24px;height:24px}
header .brand{font:800 15px/1 var(--sans);letter-spacing:.08em;color:var(--ink);text-decoration:none}
header .sp{flex:1}
.lng{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lng button{padding:7px 10px;font:700 12px/1 var(--mono);color:var(--ink2);min-width:44px}
.lng button+button{border-left:1px solid var(--line)}
.lng button[aria-pressed="true"]{background:#24303f;color:#fff}
h1{font:800 24px/1.2 var(--sans);margin:10px 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink2);margin-bottom:12px}
.warn{background:#2a1416;border:1px solid #6b2328;border-left:5px solid var(--red);border-radius:6px;padding:10px 12px;font-size:14.5px}
.warn b{color:#fff}
nav.toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
nav.toc a{font:600 13px/1 var(--sans);color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 11px}
nav.toc a:hover,nav.toc a:focus-visible{border-color:#3b4a60;background:var(--panel2)}
section{margin-top:22px}
h2{font:800 13px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rules{list-style:none;counter-reset:r;display:grid;gap:8px}
.rules li{counter-increment:r;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px 11px 50px}
.rules li::before{content:counter(r);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;
  font:800 14px/26px var(--sans);text-align:center}
.rules b{color:#fff}
.note{color:var(--ink2);font-size:13.5px;margin:-2px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.wc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c,var(--ink2));border-radius:8px;padding:11px 12px 12px}
.wh{display:flex;gap:10px;align-items:flex-start}
.ic{flex:none;width:42px;height:42px;border-radius:8px;background:#0e1117;border:1px solid var(--line)}
.wh h3{font:750 16px/1.25 var(--sans);margin-bottom:5px}
.chip{display:inline-block;font:700 12px/1.3 var(--sans);color:#111;background:var(--c,var(--ink2));border-radius:4px;padding:3px 7px}
.see{color:var(--ink2);font-size:14px;margin:9px 0 6px}
ul.do,.sit ul{padding-left:20px;display:grid;gap:5px}
ul.do li::marker,.sit li::marker{color:var(--c,var(--ink3))}
.sil .glyph{fill:var(--c);stroke:#0b0d11;stroke-width:1px;vector-effect:non-scaling-stroke}
.sil .glyph.x{fill:none;stroke:var(--c);stroke-width:2.2px}.sil .glyph.ring{fill:none;stroke:var(--c);stroke-width:1.6px}
.sil .jetfx{display:none}.sil.jet .jetfx{display:inline}.sil .flame{fill:#ffb347;stroke:none}.sil .flame2{fill:#fff4d6;stroke:none}
.sil.bal .glyph{fill:#fff;stroke:#ff1744;stroke-width:1.4px}
.sits{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sits section{margin-top:0}
.sit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px 12px}
.sit h3{font:750 16px/1.25 var(--sans);margin-bottom:7px}
#car{--c:var(--amb);border-color:#5a4126}
#rad{--c:#ffd500}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nums a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.nums b{font:800 26px/1 var(--mono);color:#fff}
.nums span{font-size:13px;color:var(--ink2)}
.srcs{padding-left:20px;display:grid;gap:4px;font-size:13.5px}
.srcs small{color:var(--ink3)}
footer{margin:26px 0 30px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);display:grid;gap:8px}
footer .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
footer button{border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:600 13px var(--sans);color:var(--ink)}
#saved{color:#a8f0cf}
noscript p{margin:16px 0;padding:12px;border:1px solid #6b2328;border-radius:6px}
@media (max-width:420px){h1{font-size:21px}.cards,.sits{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:9mm}
  :root{--bg:#fff;--panel:#fff;--panel2:#fff;--line:#999;--ink:#000;--ink2:#222;--ink3:#444}
  html,body{font-size:9.6px;line-height:1.35;background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .lng,nav.toc,footer button,#saved,header img{display:none!important}
  header{padding:0 0 2px}h1{font-size:16px;margin:2px 0}.sub{margin-bottom:4px}
  .warn{background:#fff;border-color:#000;padding:5px 8px;font-size:9.6px}
  .warn b,.rules b,.nums b{color:#000}
  section,.sits{margin-top:8px}h2{font-size:9.5px;margin-bottom:5px;padding-bottom:3px}
  .rules{grid-template-columns:1fr 1fr;gap:4px}.rules li{padding:5px 6px 5px 28px}
  .rules li::before{background:#000;width:16px;height:16px;font-size:10px;line-height:16px;left:6px;top:5px}
  .cards,.sits{grid-template-columns:1fr 1fr 1fr;gap:5px}
  .wc,.sit{padding:5px 7px 6px}.ic{width:24px;height:24px;background:#fff}
  .wh h3,.sit h3{font-size:11px;margin-bottom:3px}.see{font-size:9.2px;margin:4px 0 3px}
  ul.do,.sit ul{padding-left:13px;gap:2px}
  .chip{border:1px solid #000;background:#fff;color:#000;font-size:9px;padding:1px 4px}
  .nums{grid-template-columns:repeat(5,1fr);gap:4px}.nums a{padding:4px 6px}.nums b{font-size:15px}.nums span{font-size:8.6px}
  .srcs{font-size:8.4px;gap:1px}.note{font-size:9px;margin:0 0 4px}
  footer{margin:8px 0 0;padding-top:4px;gap:2px;font-size:8.6px}
  .wc,.sit,.rules li,.nums a{break-inside:avoid}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script src="/static/glyphs.js"></script>
<script>
(function(){
'use strict';
var GD=JSON.parse(document.getElementById('gd').textContent), SRC=JSON.parse(document.getElementById('gsrc').textContent);
var LN={uk:'УКР',en:'EN',fr:'FR'}, ORDER=['uk','en','fr'], NUMS=['101','102','103','104','112'];
var NAV=['always','weapons','car','out','home','kids','after','rad','num','src'];
// the map's own silhouette and colour for each card (static/glyphs.js, the same as on Tactical and Light)
var ICON={shahed:['drone','var(--ora)',''],jet:['jetdrone','var(--amb)',' jet'],cruise:['missile','var(--msl)',''],
  ballistic:['ballistic','var(--msl)',' bal'],kab:['bomb','var(--vio)',''],debris:['down','var(--ink2)','']};
var $=function(id){return document.getElementById(id);};
function pick(){
  try{ var q=new URLSearchParams(location.search).get('lang'); if(GD[q]) return q; }catch(e){}
  try{ var l=localStorage.getItem('lang'); if(GD[l]) return l; }catch(e){}
  var n=(navigator.language||'en').slice(0,2).toLowerCase(); return n==='uk'||n==='ru'?'uk':n==='fr'?'fr':'en';
}
var LANG=pick();
function icon(id){
  var I=ICON[id], g=(typeof G!=='undefined'&&I)?G[I[0]]:'';
  return '<svg class="ic" viewBox="-14 -14 28 28" aria-hidden="true"><g class="sil'+I[2]+'" style="--c:'+I[1]+'">'+(g||'')+'</g></svg>';
}
function li(a){ return a.map(function(x){ return '<li>'+x+'</li>'; }).join(''); }
function render(){
  var T=GD[LANG], h='';
  document.documentElement.lang=LANG; document.title=T.title;
  $('lng').setAttribute('aria-label',T.lang);
  $('lng').innerHTML=ORDER.map(function(l){ return '<button type="button" lang="'+l+'" data-l="'+l+'" aria-pressed="'+(l===LANG)+'">'+LN[l]+'</button>'; }).join('');
  h+='<h1>'+T.h1+'</h1><p class="sub">'+T.sub+'</p><div class="warn" role="note">'+T.intro+'</div>';
  h+='<nav class="toc">'+NAV.map(function(k){ return '<a href="#'+k+'">'+T.nav[k]+'</a>'; }).join('')+'</nav>';
  h+='<section id="always"><h2>'+T.always.h+'</h2><ol class="rules">'+li(T.always.items)+'</ol></section>';
  h+='<section id="weapons"><h2>'+T.weapons.h+'</h2><p class="note">'+T.weapons.note+'</p><div class="cards">'+
    T.weapons.cards.map(function(c){ return '<article class="wc" id="w-'+c.id+'" style="--c:'+ICON[c.id][1]+'"><div class="wh">'+icon(c.id)+
      '<div><h3>'+c.name+'</h3><span class="chip">⏱ '+c.warn+'</span></div></div><p class="see">'+c.see+'</p><ul class="do">'+li(c.do)+'</ul></article>'; }).join('')+'</div></section>';
  h+='<div class="sits">'+T.sit.map(function(s){ return '<section class="sit" id="'+s.id+'"><h3>'+s.h+'</h3><ul>'+li(s.items)+'</ul></section>'; }).join('')+'</div>';
  h+='<section id="num"><h2>'+T.num.h+'</h2><div class="nums">'+NUMS.map(function(n){ return '<a href="tel:'+n+'"><b>'+n+'</b><span>'+T.num.n[n]+'</span></a>'; }).join('')+'</div></section>';
  h+='<section id="src"><h2>'+T.src.h+'</h2><p class="note">'+T.src.note+'</p><ol class="srcs">'+
    SRC.map(function(s){ return '<li><a href="'+s[2]+'" target="_blank" rel="noopener noreferrer" lang="uk">'+s[1]+'</a> <small>· '+s[0]+'</small></li>'; }).join('')+'</ol></section>';
  $('main').innerHTML=h;
  $('foot').innerHTML='<div class="row"><span>'+T.foot.checked+'</span><button type="button" id="prn">'+T.foot.print+'</button><span id="saved" hidden>'+T.foot.saved+'</span></div>'+
    '<div class="row"><a href="/m">'+T.foot.map+'</a><a href="/light">'+T.foot.light+'</a></div><div>'+T.foot.disc+'</div>';
  $('prn').onclick=function(){ window.print(); };
  saved();
}
$('lng').addEventListener('click',function(e){ var b=e.target.closest('button[data-l]'); if(!b||b.dataset.l===LANG) return;
  LANG=b.dataset.l; try{ localStorage.setItem('lang',LANG); }catch(x){}
  try{ var u=new URL(location.href); if(u.searchParams.has('lang')){ u.searchParams.delete('lang'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch(x){}
  render(); });
// kept on this phone by the service worker: said only once the copy is really there
function saved(){ if(!('caches' in window)) return;
  caches.match('/guide').then(function(r){ var e=$('saved'); if(e) e.hidden=!r; }).catch(function(){}); }
render();
// the content is drawn by the script, so the browser's own jump to #rad (from the nuclear-event banner) came too early
if(location.hash){ var t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').then(function(){ return navigator.serviceWorker.ready; })
  .then(function(){ setTimeout(saved,1500); }).catch(function(){}); }
})();
</script>
