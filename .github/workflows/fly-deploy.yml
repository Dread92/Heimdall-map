# Optional: deploy to Fly.io on every push to main.
# Enable it by adding the repository secret FLY_API_TOKEN (fly tokens create deploy).
# Without that secret the job is skipped, so the workflow is harmless until you want it.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# 1.58.46, the audit (I6): the job reads the code, nothing more; every action pinned to a commit (a moving branch could
# change what runs next to FLY_API_TOKEN)
permissions:
  contents: read

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1   # 1.6
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only --ha=false
