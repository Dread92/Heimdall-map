name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 1.58.46, the audit (I6): and every action pinned to a commit

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Tests
        run: python -m pytest

      - name: The service must start and answer
        run: |
          python app/server.py --demo --port 8123 &
          for i in $(seq 1 30); do
            sleep 1
            curl -fsS http://127.0.0.1:8123/api/version && break
          done
          curl -fsS http://127.0.0.1:8123/api/version | grep -q '"now"'
          curl -fsS -o /dev/null http://127.0.0.1:8123/m
          curl -fsS -o /dev/null http://127.0.0.1:8123/static/i18n.js

  frontend:
    name: Front-end syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "20"
      - name: The page script and the translations must parse
        run: |
          node --check static/i18n.js
          node --check static/sw.js
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('static/kyiv.html', 'utf8');
            const m = html.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error('no inline script found'); process.exit(1); }
            new Function(m[1]);
            console.log('kyiv.html inline script parses');
          "
      - name: Every UI string must exist in all three languages
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('static/i18n.js', 'utf8');
            const I18N = new Function(src + '; return I18N')();
            let bad = 0;
            for (const lang of ['uk', 'fr']) {
              // a plural: English and French say _1 / _n, Ukrainian _1 / _2 / _5 (tn() in i18n.js)
              const plural = k => lang === 'uk' && /_n$/.test(k) && ['_2', '_5'].every(e => k.replace(/_n$/, e) in I18N.uk);
              const missing = Object.keys(I18N.en).filter(k => !(k in I18N[lang]) && !/^raion_/.test(k) && !plural(k));
              if (missing.length) { console.error(lang + ' missing: ' + missing.join(', ')); bad = 1; }
            }
            process.exit(bad);
          "
